test-ingestion-notification:
  description: "Test notification-based ingestion using an existing instance of the ska-src-dm-di-ingestor service."
  module_name: "tasks.tests.ingestion"
  class_name: "TestIngestionRemoteNotification"
  enabled: true
  args:
  kwargs:
    task_name: "ingestion_notification_test"
    n_files: 3
    scope: "testing"
    prefix: "test1"
    sizes: 100000
    source_dir: "/tmp/ingest-source"
    ingest_dir: "/tmp/ingest"
    notification_file_suffix: "ingest.notification"
    project_id: "rucio-task-manager-test"
    n_retries: 5
    delay_s: 5
    output:
      databases:
        # in-cluster monitoring ES (basic auth via ELASTICSEARCH_USERNAME/ELASTICSEARCH_PASSWORD env vars)
        - type: es
          uri: https://monitoring.test:443/elastic
          index: rucio-task-manager.skao-dev.tasks.tests.ingestion-notification
